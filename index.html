  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Interactive Matrix-Dot Grid Background (HTML5 Canvas) ---
    const MatrixGridCanvas = () => {
      const canvasRef = useRef(null);
      const mouseRef = useRef({
        x: -1000,
        y: -1000,
        targetX: -1000,
        targetY: -1000,
        isHovered: false
      });

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const handleMouseMove = (e) => {
          mouseRef.current.targetX = e.clientX;
          mouseRef.current.targetY = e.clientY;
          mouseRef.current.isHovered = true;
        };

        const handleMouseLeave = () => {
          mouseRef.current.isHovered = false;
        };

        const handleTouchMove = (e) => {
          if (e.touches.length > 0) {
            mouseRef.current.targetX = e.touches[0].clientX;
            mouseRef.current.targetY = e.touches[0].clientY;
            mouseRef.current.isHovered = true;
          }
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        window.addEventListener('touchmove', handleTouchMove);

        // Grid Configuration
        const spacing = 34; // Distance between dots
        let time = 0;

        const render = () => {
          time += 0.025;

          // Smooth lerp mouse position
          mouseRef.current.x += (mouseRef.current.targetX - mouseRef.current.x) * 0.1;
          mouseRef.current.y += (mouseRef.current.targetY - mouseRef.current.y) * 0.1;

          ctx.clearRect(0, 0, width, height);

          const cols = Math.ceil(width / spacing) + 2;
          const rows = Math.ceil(height / spacing) + 2;
          const mouseX = mouseRef.current.x;
          const mouseY = mouseRef.current.y;
          const maxDist = 180; // Ripple / interaction radius

          const activeDots = [];

          for (let i = 0; i < cols; i++) {
            for (let j = 0; j < rows; j++) {
              const baseX = i * spacing;
              const baseY = j * spacing;

              // Perspective / wave oscillation
              const wave = Math.sin(i * 0.2 + time) * Math.cos(j * 0.2 + time) * 3;

              // Distance to mouse cursor
              const dx = mouseX - baseX;
              const dy = mouseY - baseY;
              const dist = Math.sqrt(dx * dx + dy * dy);

              let posX = baseX;
              let posY = baseY + wave;
              let radius = 1.25;
              let alpha = 0.14;
              let isLime = false;

              if (dist < maxDist) {
                const influence = 1 - dist / maxDist; // 0 to 1
                // Dynamic ripple shift
                const ripple = Math.sin(dist * 0.08 - time * 3) * influence * 8;
                const angle = Math.atan2(dy, dx);
                
                // Repel dots slightly from cursor for interactive 3D topography effect
                posX -= Math.cos(angle) * influence * 12;
                posY -= Math.sin(angle) * influence * 12 + ripple;

                radius = 1.25 + influence * 3.2;
                alpha = 0.18 + influence * 0.82;
                if (influence > 0.4) isLime = true;

                activeDots.push({ x: posX, y: posY, alpha, influence });
              }

              // Draw dot
              ctx.beginPath();
              ctx.arc(posX, posY, radius, 0, Math.PI * 2);
              if (isLime) {
                ctx.fillStyle = `rgba(163, 230, 53, ${alpha})`; // Lime accent
              } else {
                ctx.fillStyle = `rgba(16, 185, 129, ${alpha})`; // Emerald accent
              }
              ctx.fill();
            }
          }

          // Draw subtle holographic connecting lines between nearest active dots
          if (activeDots.length > 1) {
            ctx.lineWidth = 0.75;
            for (let a = 0; a < activeDots.length; a++) {
              for (let b = a + 1; b < activeDots.length; b++) {
                const dotA = activeDots[a];
                const dotB = activeDots[b];
                const d = Math.hypot(dotA.x - dotB.x, dotA.y - dotB.y);
                if (d < 45) {
                  const lineAlpha = (1 - d / 45) * dotA.influence * 0.35;
                  ctx.strokeStyle = `rgba(16, 185, 129, ${lineAlpha})`;
                  ctx.beginPath();
                  ctx.moveTo(dotA.x, dotA.y);
                  ctx.lineTo(dotB.x, dotB.y);
                  ctx.stroke();
                }
              }
            }
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('resize', handleResize);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('touchmove', handleTouchMove);
        };
      }, []);

      return (
        <canvas
          ref={canvasRef}
          className="fixed inset-0 pointer-events-none z-0 opacity-80"
          style={{ width: '100%', height: '100%' }}
        />
      );
    };

                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                  </svg>
                )}
              </button>
            </div>

            {/* Mobile Dropdown Menu */}
            {mobileMenuOpen && (

                  <a

                  >

                ))}
                <div className="pt-2 mt-1 border-t border-carbon-border/40 flex justify-center">
                  <a

    // --- Interactive 3D Perspective Tilt Card Component ---
    const ProjectCard = ({ project, onActionToast }) => {
      const cardRef = useRef(null);
      const [tilt, setTilt] = useState({
        rotateX: 0,
        rotateY: 0,
        translateY: 0,
        scale: 1,
      });
      const [isHovered, setIsHovered] = useState(false);
      const [glare, setGlare] = useState({ opacity: 0, x: 50, y: 50 });

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;

        // Subtle 3D angular rotation based on cursor position (-8deg to +8deg)
        const rotateX = ((y - centerY) / centerY) * -9;
        const rotateY = ((x - centerX) / centerX) * 9;

        const glareX = (x / rect.width) * 100;
        const glareY = (y / rect.height) * 100;

        setTilt({
          rotateX: Number(rotateX.toFixed(2)),
          rotateY: Number(rotateY.toFixed(2)),
          translateY: -6,
          scale: 1.02,
        });
        setGlare({ opacity: 1, x: glareX, y: glareY });
      };

      const handleMouseEnter = () => {
        setIsHovered(true);
      };

      const handleMouseLeave = () => {
        setIsHovered(false);
        setTilt({ rotateX: 0, rotateY: 0, translateY: 0, scale: 1 });
        setGlare({ opacity: 0, x: 50, y: 50 });
      };

      const handleLinkClick = (e, type, url) => {
        e.preventDefault();
        onActionToast(`${type} for "${project.title}" clicked! [${url}]`);
      };

        <div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseEnter={handleMouseEnter}
          onMouseLeave={handleMouseLeave}
          style={{
            transform: `perspective(1000px) rotateX(${tilt.rotateX}deg) rotateY(${tilt.rotateY}deg) translateY(${tilt.translateY}px) scale3d(${tilt.scale}, ${tilt.scale}, ${tilt.scale})`,
            transition: isHovered
              ? 'transform 0.08s ease-out, box-shadow 0.3s ease, border-color 0.3s ease'
              : 'transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.4s ease, border-color 0.4s ease',

    const MagneticButton = ({ children, className = '', href, ...props }) => {
      const btnRef = useRef(null);
      const [offset, setOffset] = useState({ x: 0, y: 0 });

      const handleMouseMove = (e) => {
        if (!btnRef.current) return;
        const { clientX, clientY } = e;
        const { left, top, width, height } = btnRef.current.getBoundingClientRect();
        const x = (clientX - (left + width / 2)) * 0.35;
        const y = (clientY - (top + height / 2)) * 0.35;
        setOffset({ x, y });
      };

      const handleMouseLeave = () => {
        setOffset({ x: 0, y: 0 });
      };

      return (
        <a
          ref={btnRef}
          href={href}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{

    // --- Interactive Mouse Feature (Easter Egg: Cursor Follower & Trailing Light Spark) ---
    const CursorFollower = () => {
      const dotRef = useRef(null);
      const ringRef = useRef(null);

      useEffect(() => {
        let mouseX = -100;
        let mouseY = -100;
        let ringX = -100;
        let ringY = -100;
        let animId;
        let isVisible = false;

        const handleMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;

          if (!isVisible) {
            isVisible = true;
            if (dotRef.current && ringRef.current) {
              dotRef.current.style.opacity = '1';
              ringRef.current.style.opacity = '1';
            }
          }

          if (dotRef.current) {
            dotRef.current.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0)`;
          }
        };

        const handleMouseLeave = () => {
          isVisible = false;
          if (dotRef.current && ringRef.current) {
            dotRef.current.style.opacity = '0';
            ringRef.current.style.opacity = '0';
          }
        };

        const animate = () => {
          ringX += (mouseX - ringX) * 0.16;
          ringY += (mouseY - ringY) * 0.16;

          if (ringRef.current) {
            ringRef.current.style.transform = `translate3d(${ringX}px, ${ringY}px, 0)`;
          }
          animId = requestAnimationFrame(animate);
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);
        animId = requestAnimationFrame(animate);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          cancelAnimationFrame(animId);
        };
      }, []);

      return (
        <React.Fragment>
          <div
            ref={ringRef}
            className="pointer-events-none fixed top-0 left-0 w-8 h-8 -ml-4 -mt-4 rounded-full border border-emerald-400/40 bg-emerald-500/10 shadow-[0_0_18px_rgba(16,185,129,0.35)] z-50 opacity-0 transition-opacity duration-300"
            style={{ willChange: 'transform' }}
          />
          <div
            ref={dotRef}
            className="pointer-events-none fixed top-0 left-0 w-1.5 h-1.5 -ml-[3px] -mt-[3px] rounded-full bg-lime-300 shadow-[0_0_10px_#a3e635] z-50 opacity-0 transition-opacity duration-200"
            style={{ willChange: 'transform' }}
          />
        </React.Fragment>
      );
    };

    // --- Minimalist Cyber Footer ---

            </button>
          </div>
        </footer>
      );
    };
